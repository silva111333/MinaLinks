services:
  - type: web
    name: minalinks-robo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SITE_URL
        value: https://minalinks.sacredcaper.chatgpt.site
      - key: DATA_DIR
        value: /tmp/minalinks
      - key: OAI_SITES_TOKEN
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
